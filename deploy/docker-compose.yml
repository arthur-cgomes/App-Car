name: appcar

services:
  appcar-postgres:
    image: postgres:17-alpine
    container_name: appcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appcar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no deploy/.env}
      POSTGRES_DB: appcar
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appcar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appcar -d appcar"]
      interval: 5s
      timeout: 3s
      retries: 20

  appcar-redis:
    image: redis:7-alpine
    container_name: appcar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - appcar
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  appcar-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: appcar-api:latest
    container_name: appcar-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://appcar:${POSTGRES_PASSWORD}@appcar-postgres:5432/appcar
      REDIS_URL: redis://appcar-redis:6379/0
      PORT: "3000"
    depends_on:
      appcar-postgres:
        condition: service_healthy
      appcar-redis:
        condition: service_healthy
    networks:
      - appcar

  appcar-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://appcar-api:3000
    image: appcar-web:latest
    container_name: appcar-web
    restart: unless-stopped
    depends_on:
      - appcar-api
    ports:
      - "${APP_PORT:-3003}:3001"
    networks:
      - appcar

volumes:
  pgdata:
  redisdata:

networks:
  appcar:
